<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="theme-color" content="#0d0f14"/>
  <title>RiskPilot — My Accounts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    /* ── PAGE LAYOUT ── */
    .accounts-page { max-width: 960px; margin: 0 auto; padding: 2rem; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    .page-header-left h1 { font-size: 26px; font-weight: 700; color: var(--text); }
    .page-header-left p  { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

    /* ── ACCOUNT CARDS GRID ── */
    .accounts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 2rem; }

    .account-card {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 14px; padding: 1.25rem 1.5rem;
      cursor: pointer; transition: border-color 0.15s, transform 0.1s, box-shadow 0.15s;
      position: relative; overflow: hidden;
    }
    .account-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--gold); opacity: 0; transition: opacity 0.15s;
    }
    .account-card:hover { border-color: var(--gold-border); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
    .account-card:hover::before { opacity: 1; }
    .account-card.active { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,160,23,0.12); }
    .account-card.active::before { opacity: 1; }

    .ac-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .ac-name { font-size: 16px; font-weight: 700; color: var(--text); }
    .ac-type-badge { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 100px; text-transform: uppercase; letter-spacing: 0.5px; }
    .ac-type-personal { background: var(--blue-bg); color: var(--blue); border: 1px solid #1a3060; }
    .ac-type-prop     { background: var(--gold-bg); color: var(--gold); border: 1px solid var(--gold-border); }

    .ac-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .ac-stat { background: var(--bg3); border-radius: 8px; padding: 8px 12px; }
    .ac-stat-label { font-size: 10px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
    .ac-stat-val   { font-size: 16px; font-weight: 700; color: var(--text); }
    .ac-stat-val.green { color: var(--green); }
    .ac-stat-val.gold  { color: var(--gold); }

    .ac-footer { display: flex; justify-content: space-between; align-items: center; }
    .ac-currency { font-size: 11px; color: var(--text-dim); font-weight: 600; }
    .ac-active-label { font-size: 11px; font-weight: 700; color: var(--gold); display: flex; align-items: center; gap: 5px; }
    .ac-active-dot   { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .add-account-card {
      background: transparent; border: 1.5px dashed var(--border2);
      border-radius: 14px; padding: 1.5rem;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; cursor: pointer; transition: border-color 0.15s, background 0.15s;
      min-height: 160px; color: var(--text-dim);
    }
    .add-account-card:hover { border-color: var(--gold); background: var(--gold-bg); color: var(--gold); }
    .add-account-icon { font-size: 32px; }
    .add-account-text { font-size: 14px; font-weight: 600; }

    /* ── ACTIVE ACCOUNT SECTION ── */
    .active-account-section { display: none; }
    .active-account-section.visible { display: block; }

    .active-header {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.25rem 1.5rem;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem;
    }
    .active-name { font-size: 20px; font-weight: 700; color: var(--text); }
    .active-meta { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

    .open-dashboard-btn {
      padding: 10px 24px; font-size: 14px; font-weight: 700;
      background: var(--gold); color: #0d0f14;
      border: none; border-radius: 8px; cursor: pointer;
      font-family: inherit; transition: background 0.15s;
    }
    .open-dashboard-btn:hover { background: var(--gold-light); }

    /* ── TRADES TABS ── */
    .trades-tabs-wrap { margin-bottom: 1rem; }
    .trades-segmented {
      display: inline-flex;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 8px; padding: 3px; gap: 2px;
    }
    .trades-tab {
      padding: 8px 24px; font-size: 13px; font-weight: 600;
      border: none; border-radius: 6px; cursor: pointer;
      background: transparent; color: var(--text-muted);
      font-family: inherit; transition: background 0.15s, color 0.15s;
    }
    .trades-tab.active { background: var(--gold); color: #0d0f14; }

    /* ── TRADES TABLE ── */
    .trades-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .trades-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .trades-table th {
      text-align: left; padding: 10px 16px;
      font-size: 10px; font-weight: 700; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border); background: var(--bg3);
    }
    .trades-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
    .trades-table tbody tr:hover { background: var(--surface2); }
    .trades-table tbody tr:last-child td { border-bottom: none; }
    .empty-trades { text-align: center; padding: 3rem; color: var(--text-dim); font-size: 13px; font-style: italic; }

    /* ── PROP FIRM LIMITS BAR ── */
    .prop-limits { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 1rem; }
    .pl-tile { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
    .pl-label { font-size: 10px; color: var(--text-dim); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .pl-val   { font-size: 18px; font-weight: 700; color: var(--text); }
    .pl-bar   { height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .pl-fill  { height: 100%; border-radius: 2px; transition: width 0.4s; }

    @media(max-width:600px){
      .accounts-page { padding: 1rem; }
      .prop-limits   { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="accounts-page">

  <!-- Header -->
  <div class="page-header">
    <div class="page-header-left">
      <h1><span style="color:var(--text)">Risk</span><span style="color:var(--gold)">Pilot</span> — My Accounts</h1>
      <p id="user-greeting">Loading your accounts…</p>
    </div>
    <button class="btn btn-ghost" onclick="handleSignOut()" style="font-size:13px;">Sign Out</button>
  </div>

  <!-- Accounts grid -->
  <div class="accounts-grid" id="accounts-grid">
    <div class="add-account-card" onclick="goTo('account-setup.html')">
      <div class="add-account-icon">＋</div>
      <div class="add-account-text">Create Trading Account</div>
    </div>
  </div>

  <!-- Active account detail -->
  <div class="active-account-section" id="active-account-section">

    <!-- Active account header -->
    <div class="active-header">
      <div>
        <div class="active-name" id="active-account-name">—</div>
        <div class="active-meta" id="active-account-meta">—</div>
      </div>
      <button class="open-dashboard-btn" onclick="enterDashboard()">Open Dashboard →</button>
    </div>

    <!-- Prop firm limits (only shown for prop accounts) -->
    <div class="prop-limits" id="prop-limits" style="display:none;">
      <div class="pl-tile">
        <div class="pl-label">Profit Target</div>
        <div class="pl-val" id="pl-target">—</div>
        <div class="pl-bar"><div class="pl-fill" id="pl-target-fill" style="background:var(--green);width:0%"></div></div>
      </div>
      <div class="pl-tile">
        <div class="pl-label">Daily Loss Used</div>
        <div class="pl-val" id="pl-daily">—</div>
        <div class="pl-bar"><div class="pl-fill" id="pl-daily-fill" style="background:var(--amber);width:0%"></div></div>
      </div>
      <div class="pl-tile">
        <div class="pl-label">Max Loss Used</div>
        <div class="pl-val" id="pl-max">—</div>
        <div class="pl-bar"><div class="pl-fill" id="pl-max-fill" style="background:var(--red);width:0%"></div></div>
      </div>
    </div>

    <!-- Trades tabs -->
    <div class="trades-tabs-wrap">
      <div class="trades-segmented">
        <button class="trades-tab active" onclick="switchTradeTab('open')">Open &amp; Pending</button>
        <button class="trades-tab"        onclick="switchTradeTab('closed')">Closed Trades</button>
      </div>
    </div>

    <!-- Trades table -->
    <div class="trades-card">
      <table class="trades-table">
        <thead>
          <tr id="trades-header">
            <th>Instrument</th><th>Date</th><th>Setup</th><th>Direction</th>
            <th>Lot Size</th><th>Risk</th><th>Outcome</th><th>P&amp;L</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="trades-body">
          <tr><td colspan="9" class="empty-trades">Select an account above to view trades.</td></tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
let currentUser = null;
let accounts    = [];
let activeAccId = null;
let tradeTab    = 'open';

function base(){ const p=window.location.pathname; return window.location.origin+p.substring(0,p.lastIndexOf('/')+1); }
function goTo(f){ window.location.href=base()+f; }

/* ── BOOT ── */
(async function boot(){
  const {data} = await supabase.auth.getSession();
  if(!data.session){ goTo('auth.html'); return; }
  currentUser = data.session.user;

  // Check license
  const {data:prof} = await supabase.from('riskpilot_data').select('license_valid').eq('user_id',currentUser.id).single();
  if(!prof || prof.license_valid !== true){ goTo('license.html'); return; }

  const name = currentUser.user_metadata?.name || currentUser.email;
  document.getElementById('user-greeting').textContent = 'Welcome back, '+name;

  await loadAccounts();
})();

/* ── LOAD ACCOUNTS ── */
async function loadAccounts(){
  const {data,error} = await supabase
    .from('trading_accounts')
    .select('*')
    .eq('user_id',currentUser.id)
    .order('created_at',{ascending:false});

  if(error){ console.error(error); return; }
  accounts = data || [];

  // Restore last active account from localStorage
  const savedId = localStorage.getItem('rp_active_account_'+currentUser.id);
  if(savedId && accounts.find(a=>a.id===savedId)) activeAccId = savedId;
  else if(accounts.length > 0) activeAccId = accounts[0].id;

  renderAccountCards();
  if(activeAccId) renderActiveAccount(activeAccId);
}

/* ── RENDER CARDS ── */
function renderAccountCards(){
  const grid = document.getElementById('accounts-grid');
  const addBtn = '<div class="add-account-card" onclick="goTo(\'account-setup.html\')"><div class="add-account-icon">＋</div><div class="add-account-text">Create Trading Account</div></div>';

  if(!accounts.length){ grid.innerHTML = addBtn; return; }

  const cards = accounts.map(a => {
    const isProp   = a.account_type === 'prop';
    const isActive = a.id === activeAccId;
    const sym      = a.currency === 'USD' ? '$' : 'R';
    const wallet   = parseFloat(a.weekly_wallet||0).toFixed(0);
    const winrate  = calcWinRate(a.id);
    const typeBadge= isProp
      ? '<span class="ac-type-badge ac-type-prop">Prop Firm</span>'
      : '<span class="ac-type-badge ac-type-personal">Personal</span>';
    const activeLabel = isActive
      ? '<span class="ac-active-label"><span class="ac-active-dot"></span>Active</span>' : '';

    return `<div class="account-card ${isActive?'active':''}" onclick="selectAccount('${a.id}')">
      <div class="ac-header">
        <div class="ac-name">${escHtml(a.account_name)}</div>
        ${typeBadge}
      </div>
      <div class="ac-stats">
        <div class="ac-stat">
          <div class="ac-stat-label">${isProp?'Account Size':'Weekly Wallet'}</div>
          <div class="ac-stat-val ${isProp?'gold':'green'}">${sym}${isProp ? Number(a.account_size||0).toLocaleString() : wallet}</div>
        </div>
        <div class="ac-stat">
          <div class="ac-stat-label">Win Rate</div>
          <div class="ac-stat-val">${winrate}</div>
        </div>
      </div>
      <div class="ac-footer">
        <span class="ac-currency">${a.currency} · ${isProp?'Prop':'Funded'}</span>
        ${activeLabel}
      </div>
    </div>`;
  }).join('');

  grid.innerHTML = cards + addBtn;
}

/* ── SELECT ACCOUNT ── */
function selectAccount(id){
  activeAccId = id;
  localStorage.setItem('rp_active_account_'+currentUser.id, id);
  renderAccountCards();
  renderActiveAccount(id);
}

/* ── RENDER ACTIVE ACCOUNT DETAIL ── */
async function renderActiveAccount(id){
  const acc = accounts.find(a=>a.id===id);
  if(!acc) return;

  const section = document.getElementById('active-account-section');
  section.classList.add('visible');

  const isProp = acc.account_type === 'prop';
  const sym    = acc.currency === 'USD' ? '$' : 'R';

  document.getElementById('active-account-name').textContent = acc.account_name;
  document.getElementById('active-account-meta').textContent =
    (isProp ? 'Prop Firm Account' : 'Personal Funded Account') +
    ' · ' + acc.currency +
    (isProp ? ' · '+sym+Number(acc.account_size||0).toLocaleString()+' balance' : '');

  // Prop firm limits
  const propLimits = document.getElementById('prop-limits');
  if(isProp){
    propLimits.style.display = 'grid';
    const size        = parseFloat(acc.account_size||0);
    const profitPct   = parseFloat(acc.profit_target_pct||0);
    const dailyPct    = parseFloat(acc.daily_loss_pct||0);
    const maxPct      = parseFloat(acc.max_loss_pct||0);
    const profitTarget= size * profitPct / 100;
    const dailyLimit  = size * dailyPct  / 100;
    const maxLimit    = size * maxPct    / 100;

    // Calculate current P&L for this account from journal
    const {data:jdata} = await supabase.from('trade_journal').select('*').eq('account_id',id);
    const trades = jdata||[];
    const totalProfit = trades.filter(t=>t.outcome==='win').reduce((s,t)=>s+parseFloat(t.profit_zar||0),0);
    const todayLoss   = trades.filter(t=>t.outcome==='loss'&&t.trade_date===todayStr()).reduce((s,t)=>s+parseFloat(t.risk_amount||0),0);
    const totalLoss   = trades.filter(t=>t.outcome==='loss').reduce((s,t)=>s+parseFloat(t.risk_amount||0),0);

    document.getElementById('pl-target').textContent = sym+totalProfit.toFixed(0)+' / '+sym+profitTarget.toFixed(0)+' ('+profitPct+'%)';
    document.getElementById('pl-daily').textContent  = sym+todayLoss.toFixed(0)+' / '+sym+dailyLimit.toFixed(0)+' ('+dailyPct+'%)';
    document.getElementById('pl-max').textContent    = sym+totalLoss.toFixed(0)+' / '+sym+maxLimit.toFixed(0)+' ('+maxPct+'%)';
    document.getElementById('pl-target-fill').style.width = Math.min(100,(totalProfit/profitTarget)*100)+'%';
    document.getElementById('pl-daily-fill').style.width  = Math.min(100,(todayLoss/dailyLimit)*100)+'%';
    document.getElementById('pl-max-fill').style.width    = Math.min(100,(totalLoss/maxLimit)*100)+'%';
  } else {
    propLimits.style.display = 'none';
  }

  await loadTrades(id);
}

/* ── LOAD TRADES ── */
async function loadTrades(accountId){
  const {data,error} = await supabase
    .from('trade_journal')
    .select('*')
    .eq('account_id', accountId)
    .order('trade_date',{ascending:false});

  if(error){ console.error(error); return; }
  renderTradesTable(data||[]);
}

function renderTradesTable(trades){
  const body = document.getElementById('trades-body');
  const acc  = accounts.find(a=>a.id===activeAccId);
  const sym  = acc?.currency==='USD'?'$':'R';

  const filtered = tradeTab==='open'
    ? trades.filter(t=>t.outcome==='pending'||t.outcome==='not_triggered')
    : trades.filter(t=>t.outcome==='win'||t.outcome==='loss');

  if(!filtered.length){
    const msg = tradeTab==='open'?'No open or pending trades.':'No closed trades yet.';
    body.innerHTML='<tr><td colspan="9" class="empty-trades">'+msg+'</td></tr>';
    return;
  }

  body.innerHTML = filtered.map(t=>{
    const ob  = t.outcome==='win'?'badge-green':t.outcome==='loss'?'badge-red':t.outcome==='not_triggered'?'badge-skip':'badge-amber';
    const ol  = t.outcome==='win'?'Win':t.outcome==='loss'?'Loss':t.outcome==='not_triggered'?'N/T':'Pending';
    const pnl = t.outcome==='win'?parseFloat(t.profit_zar||0):t.outcome==='loss'?-parseFloat(t.risk_amount||0):null;
    const ps  = pnl!==null?`<span style="color:${pnl>=0?'var(--green)':'var(--red)'}; font-weight:700">${pnl>=0?'+':''}${sym}${Math.abs(pnl).toFixed(0)}</span>`:'—';
    const sb  = t.setup_type==='A'?'badge-blue':'badge-amber';
    const dir = t.direction==='buy'?'▲ Buy':'▼ Sell';

    // Action buttons for pending trades
    let actions = '—';
    if(t.outcome==='pending'){
      actions = `<div style="display:flex;gap:5px">
        <button class="ja-btn ja-win"  onclick="markTrade('${t.id}','win')">✓ Win</button>
        <button class="ja-btn ja-loss" onclick="markTrade('${t.id}','loss')">✗ Loss</button>
        <button class="ja-btn ja-nt"   onclick="markTrade('${t.id}','not_triggered')">⏭ N/T</button>
      </div>`;
    }

    return `<tr>
      <td style="font-weight:600">${t.instrument||'—'}</td>
      <td style="font-size:12px;color:var(--text-muted)">${t.trade_date||'—'}</td>
      <td><span class="badge ${sb}">A-Setup</span></td>
      <td style="font-size:12px">${dir}</td>
      <td style="font-weight:600;color:var(--gold)">${parseFloat(t.lot_size||0).toFixed(2)} lots</td>
      <td>${sym}${parseFloat(t.risk_amount||0).toFixed(0)}</td>
      <td><span class="badge ${ob}">${ol}</span></td>
      <td>${ps}</td>
      <td>${actions}</td>
    </tr>`;
  }).join('');
}

/* ── MARK TRADE ── */
async function markTrade(tradeId, outcome){
  const {data:trade} = await supabase.from('trade_journal').select('*').eq('id',tradeId).single();
  if(!trade) return;

  await supabase.from('trade_journal').update({outcome}).eq('id',tradeId);

  // Update account wallet if win
  if(outcome==='win'){
    const acc = accounts.find(a=>a.id===trade.account_id);
    if(acc){
      const newWallet = parseFloat(acc.weekly_wallet||0) + parseFloat(trade.profit_zar||0) + parseFloat(trade.risk_amount||0);
      await supabase.from('trading_accounts').update({weekly_wallet:newWallet}).eq('id',acc.id);
      acc.weekly_wallet = newWallet;
    }
  }

  await loadAccounts();
  renderActiveAccount(activeAccId);
}

/* ── TAB SWITCH ── */
function switchTradeTab(tab){
  tradeTab = tab;
  document.querySelectorAll('.trades-tab').forEach((btn,i)=>{
    btn.classList.toggle('active', (i===0&&tab==='open')||(i===1&&tab==='closed'));
  });
  renderActiveAccount(activeAccId);
}

/* ── ENTER DASHBOARD ── */
function enterDashboard(){
  if(!activeAccId){ alert('Please select an account first.'); return; }
  localStorage.setItem('rp_active_account_'+currentUser.id, activeAccId);
  goTo('dashboard.html');
}

/* ── HELPERS ── */
function calcWinRate(accountId){
  // Will be calculated from loaded trade data — placeholder for now
  return '—';
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
async function handleSignOut(){
  await supabase.auth.signOut();
  goTo('auth.html');
}
</script>
</body>
</html>
