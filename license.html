<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="theme-color" content="#0d0f14"/>
  <title>RiskPilot — Activate License</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:         #0d0f14;
      --bg2:        #131720;
      --bg3:        #1a1f2e;
      --surface:    #1e2438;
      --border:     #2a3048;
      --text:       #e8ecf4;
      --text-muted: #7a84a0;
      --text-dim:   #4a5270;
      --gold:       #d4a017;
      --gold-light: #f0c040;
      --gold-bg:    #1e1608;
      --gold-border:#3d2e08;
      --green:      #22c984;
      --green-bg:   #0f2a1e;
      --red:        #f05060;
      --red-bg:     #2a0f14;
      --red-border: #4d1620;
      --radius:     10px;
      --radius-sm:  6px;
    }
    html, body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(212,160,23,0.07) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(77,142,245,0.04) 0%, transparent 50%);
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }

    /* Logo */
    .logo-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 2rem; }
    .logo-icon {
      width: 52px; height: 52px;
      background: var(--gold-bg);
      border: 1.5px solid var(--gold-border);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 12px;
    }
    .logo-name { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    .logo-risk  { color: var(--text); }
    .logo-pilot { color: var(--gold); }
    .logo-tag   { font-size: 10px; font-weight: 600; color: var(--text-dim); letter-spacing: 2.5px; text-transform: uppercase; margin-top: 4px; }

    /* Key icon */
    .key-icon {
      width: 64px; height: 64px;
      background: var(--gold-bg);
      border: 1.5px solid var(--gold-border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.25rem;
      font-size: 28px;
    }

    h2 { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 6px; }
    .sub { font-size: 13px; color: var(--text-muted); text-align: center; line-height: 1.5; margin-bottom: 1.75rem; }

    label {
      display: block;
      font-size: 11px; font-weight: 600;
      color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 6px;
    }
    .key-input-wrap { position: relative; margin-bottom: 1rem; }
    input[type="text"] {
      width: 100%;
      background: var(--bg2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 600;
      color: var(--gold);
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    input[type="text"]:focus { border-color: var(--gold); }
    input[type="text"]::placeholder { color: var(--text-dim); letter-spacing: 1px; font-weight: 400; text-transform: none; }

    .btn {
      width: 100%;
      padding: 13px;
      font-size: 15px; font-weight: 700;
      font-family: inherit;
      border: none; border-radius: var(--radius-sm);
      cursor: pointer;
      background: var(--gold); color: #0d0f14;
      transition: background 0.15s, transform 0.1s;
      margin-bottom: 12px;
    }
    .btn:hover { background: var(--gold-light); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .alert {
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px; margin-bottom: 14px; display: none;
      line-height: 1.4;
    }
    .alert-error   { background: var(--red-bg);   color: var(--red);   border: 1px solid var(--red-border); }
    .alert-success { background: var(--green-bg);  color: var(--green); border: 1px solid #164d32; }
    .alert.show { display: block; }

    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(13,15,20,0.3);
      border-top-color: #0d0f14;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      margin-right: 6px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .signout-row { text-align: center; margin-top: 4px; }
    .link-btn {
      background: none; border: none; color: var(--text-dim);
      font-size: 12px; cursor: pointer; font-family: inherit; padding: 0;
    }
    .link-btn:hover { color: var(--text-muted); text-decoration: underline; }

    /* Steps */
    .steps {
      display: flex;
      gap: 8px;
      margin-bottom: 1.75rem;
    }
    .step {
      flex: 1; height: 3px; border-radius: 2px;
      background: var(--border);
    }
    .step.done  { background: var(--gold); }
    .step.active{ background: var(--gold); opacity: 0.5; }

    .step-label {
      text-align: center;
      font-size: 11px; color: var(--text-dim);
      margin-bottom: 1.25rem;
      letter-spacing: 0.3px;
    }
    .step-label strong { color: var(--gold); }

    @media (max-width: 480px) {
      .card { padding: 1.75rem 1.25rem; }
    }
  </style>
</head>
<body>
<div class="card">

  <!-- Logo -->
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
        <polygon points="16,3 29,28 3,28" fill="none" stroke="#d4a017" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="16" cy="13" r="2.5" fill="#d4a017"/>
        <line x1="16" y1="16" x2="16" y2="23" stroke="#d4a017" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="logo-name"><span class="logo-risk">Risk</span><span class="logo-pilot">Pilot</span></div>
    <div class="logo-tag">Master Your Risk</div>
  </div>

  <!-- Progress steps -->
  <div class="steps">
    <div class="step done"></div>
    <div class="step active"></div>
  </div>
  <div class="step-label">Step 2 of 2 — <strong>Activate Your License</strong></div>

  <!-- Key icon -->
  <div class="key-icon">🔑</div>

  <h2>Enter Your License Key</h2>
  <p class="sub">
    Your account is ready! Enter the license key you received from RiskPilot to unlock full access to the platform.
  </p>

  <div class="alert alert-error"   id="key-error"></div>
  <div class="alert alert-success" id="key-success"></div>

  <label for="license-input">License Key</label>
  <div class="key-input-wrap">
    <input
      type="text"
      id="license-input"
      placeholder="XXXX-XXXX-XXXX-XXXX"
      maxlength="19"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="characters"
      spellcheck="false"
      oninput="formatKey(this)"
    />
  </div>

  <button class="btn" id="activate-btn" onclick="activateLicense()">
    Activate &amp; Enter RiskPilot
  </button>

  <div class="signout-row">
    <button class="link-btn" onclick="handleSignOut()">Sign out and use a different account</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  /* ── PATH HELPER ── */
  function basePath() {
    const p = window.location.pathname;
    return window.location.origin + p.substring(0, p.lastIndexOf('/') + 1);
  }
  function goTo(file) { window.location.href = basePath() + file; }

  /* ── FORMAT KEY INPUT (auto-insert dashes: XXXX-XXXX-XXXX-XXXX) ── */
  function formatKey(input) {
    let val = input.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 16);
    let formatted = val.match(/.{1,4}/g)?.join('-') || val;
    input.value = formatted;
  }

  /* ── ALERT ── */
  function showAlert(id, msg) {
    ['key-error','key-success'].forEach(i => {
      const el = document.getElementById(i);
      el.classList.remove('show'); el.textContent = '';
    });
    const el = document.getElementById(id);
    el.textContent = msg; el.classList.add('show');
  }

  function setLoading(loading) {
    const btn = document.getElementById('activate-btn');
    btn.disabled = loading;
    btn.innerHTML = loading
      ? '<span class="spinner"></span> Activating…'
      : 'Activate &amp; Enter RiskPilot';
  }

  /* ── ACTIVATE ── */
  async function activateLicense() {
    const raw = document.getElementById('license-input').value.trim();
    const key = raw.replace(/-/g, '').toUpperCase(); // strip dashes for DB lookup

    if (key.length < 12) {
      showAlert('key-error', 'Please enter a valid license key.');
      return;
    }

    setLoading(true);

    // Get current user
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { goTo('auth.html'); return; }
    const userId = session.user.id;

    // Look up the key in the database
    const { data: licenseRow, error: fetchErr } = await supabase
      .from('license_keys')
      .select('*')
      .eq('key_value', key)
      .single();

    if (fetchErr || !licenseRow) {
      setLoading(false);
      showAlert('key-error', '❌ Invalid license key. Please check and try again, or contact RiskPilot support.');
      return;
    }

    // Check if already used by someone else
    if (licenseRow.used_by && licenseRow.used_by !== userId) {
      setLoading(false);
      showAlert('key-error', '❌ This license key has already been activated on another account.');
      return;
    }

    // Already activated by THIS user (shouldn't reach here normally, but safe fallback)
    if (licenseRow.used_by === userId) {
      goTo('dashboard.html');
      return;
    }

    // Claim the key — mark it as used
    const { error: updateErr } = await supabase
      .from('license_keys')
      .update({
        used_by:    userId,
        used_email: session.user.email,
        used_at:    new Date().toISOString(),
        is_active:  false   // consumed — can no longer be used by anyone else
      })
      .eq('id', licenseRow.id);

    if (updateErr) {
      setLoading(false);
      showAlert('key-error', '❌ Activation failed. Please try again.');
      return;
    }

    // Write license status to the user's profile in riskpilot_data
    await supabase
      .from('riskpilot_data')
      .upsert({
        user_id:         userId,
        license_key:     key,
        license_valid:   true,
        weekly_budget:   0,
        daily_budget:    0,
        used_today:      0,
        weekly_wallet:   0,
        currency:        'ZAR',
        journal:         '[]',
        last_saved:      new Date().toISOString(),
      }, { onConflict: 'user_id' });

    showAlert('key-success', '✅ License activated! Welcome to RiskPilot. Redirecting…');
    setTimeout(() => goTo('accounts.html'), 1500);
  }

  /* ── SIGN OUT ── */
  async function handleSignOut() {
    await supabase.auth.signOut();
    goTo('auth.html');
  }

  /* ── GUARD: must be logged in; skip if already licensed ── */
  (async function() {
    const { data } = await supabase.auth.getSession();
    if (!data.session) { goTo('auth.html'); return; }
    const { data: profile } = await supabase
      .from('riskpilot_data')
      .select('license_valid')
      .eq('user_id', data.session.user.id)
      .single();
    if (profile?.license_valid === true) { goTo('accounts.html'); }
  })();

  // Allow Enter key
  document.getElementById('license-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') activateLicense();
  });
</script>
</body>
</html>
