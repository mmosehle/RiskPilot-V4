<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="theme-color" content="#0d0f14"/>
  <title>RiskPilot — All Accounts</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    
    
    
    .page-body{padding:1.25rem;max-width:700px;margin:0 auto;}
    .section-title{font-size:14px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px;}
    .acc-list{display:flex;flex-direction:column;gap:10px;margin-bottom:2rem;}
    .acc-row{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color 0.15s;}
    .acc-row:hover{border-color:var(--gold);}
    .acc-row.active-acc{border-color:var(--gold);}
    .ar-icon{width:42px;height:42px;border-radius:10px;background:var(--gold-bg);border:1px solid var(--gold-border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
    .ar-info{flex:1;min-width:0;}
    .ar-name{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .ar-meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
    .ar-wallet{font-size:16px;font-weight:700;color:var(--green);flex-shrink:0;}
    .ar-actions{display:flex;gap:6px;flex-shrink:0;}
    .btn-open{padding:6px 14px;font-size:12px;font-weight:700;font-family:inherit;background:var(--gold);color:#0d0f14;border:none;border-radius:6px;cursor:pointer;}
    .btn-del{padding:6px 12px;font-size:12px;font-weight:700;font-family:inherit;background:var(--red-bg);color:var(--red);border:1px solid var(--red-border);border-radius:6px;cursor:pointer;}
    .add-new-btn{width:100%;padding:14px;font-size:14px;font-weight:700;font-family:inherit;background:transparent;border:1.5px dashed var(--border2);border-radius:12px;color:var(--text-dim);cursor:pointer;transition:all 0.15s;}
    .add-new-btn:hover{border-color:var(--gold);background:var(--gold-bg);color:var(--gold);}
    .empty{text-align:center;padding:3rem;color:var(--text-dim);font-size:13px;}
    @media(max-width:480px){.ar-actions{flex-direction:column;} .ar-wallet{display:none;}}
  
/* ── MOBILE BOTTOM NAV ── */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:200;height:64px;background:var(--bg2);border-top:1px solid var(--border);align-items:center;justify-content:space-around;padding:0 4px;padding-bottom:env(safe-area-inset-bottom);}
.bn-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:1;color:var(--text-dim);text-decoration:none;font-size:10px;font-weight:600;letter-spacing:.3px;background:none;border:none;cursor:pointer;font-family:inherit;padding:6px 4px;border-radius:10px;transition:color .15s;min-width:0;}
.bn-item svg{width:22px;height:22px;flex-shrink:0;}
.bn-item.active{color:var(--gold);}
.bn-add{width:52px;height:52px;border-radius:16px;background:var(--gold);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(212,160,23,.4);flex-shrink:0;transition:transform .1s;}
.bn-add:active{transform:scale(.93);}
.bn-add svg{width:24px;height:24px;stroke:#0d0f14;fill:none;stroke-width:2.5;flex-shrink:0;}
.mo-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;backdrop-filter:blur(3px);}
.mo-ov.open{display:block;}
.mo-sh{position:fixed;bottom:0;left:0;right:0;z-index:401;background:var(--bg2);border-radius:22px 22px 0 0;border-top:1px solid var(--border);transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding-bottom:calc(24px + env(safe-area-inset-bottom));}
.mo-sh.open{transform:translateY(0);}
.ms-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0;}
.ms-title{font-size:16px;font-weight:800;color:var(--text);padding:16px 20px 8px;}
.ms-nav{display:flex;flex-direction:column;padding:0 12px;gap:2px;}
.ms-link{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:12px;text-decoration:none;transition:background .15s;}
.ms-link:active{background:var(--surface);}
.ms-icon{width:40px;height:40px;border-radius:11px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ms-icon svg{width:18px;height:18px;stroke:var(--text-muted);fill:none;stroke-width:1.8;}
.ms-body{flex:1;}
.ms-lbl{font-size:14px;font-weight:600;color:var(--text);}
.ms-sub{font-size:11px;color:var(--text-dim);margin-top:1px;}
.ms-chev{width:16px;height:16px;stroke:var(--text-dim);fill:none;flex-shrink:0;}
.ms-out{width:calc(100% - 24px);margin:10px 12px 0;padding:13px;font-size:14px;font-weight:700;font-family:inherit;background:var(--red-bg);color:var(--red);border:1px solid var(--red-border);border-radius:12px;cursor:pointer;}
@media(max-width:768px){.bnav{display:flex;}.page,.page-body{padding-top:1.25rem!important;}}

/* mobile page padding */
@media(max-width:768px){.page,.page-body{padding-bottom:80px!important;}}
</style>
</head>
<body>

</div>
<div class="page-body">
  <div class="section-title" id="acc-count">Loading accounts…</div>
  <div class="acc-list" id="acc-list"><div class="empty">Loading…</div></div>
  <button class="add-new-btn" onclick="goTo('account-setup.html')">&#43; Create New Account</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
var cu=null;
function base(){var p=window.location.pathname;return window.location.origin+p.substring(0,p.lastIndexOf('/')+1);}
function goTo(f){window.location.href=base()+f;}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

(async function boot(){
  var d=await supabase.auth.getSession();
  if(!d.data.session){goTo('auth.html');return;}
  cu=d.data.session.user;
  await load();
})();

async function load(){
  var res=await supabase.from('trading_accounts').select('*').eq('user_id',cu.id).order('created_at',{ascending:false});
  var accounts=res.data||[];
  var activeId=localStorage.getItem('rp_active_account_'+cu.id);

  document.getElementById('acc-count').textContent=accounts.length+' account'+(accounts.length!==1?'s':'');

  if(!accounts.length){
    document.getElementById('acc-list').innerHTML='<div class="empty">No accounts yet. Create your first one below.</div>';
    return;
  }

  document.getElementById('acc-list').innerHTML=accounts.map(function(a){
    var isProp=a.account_type==='prop';
    var s=a.currency==='USD'?'$':'R';
    var wallet=parseFloat(a.weekly_wallet||0);
    var isAct=a.id===activeId;
    var icon=isProp?'&#127970;':'&#128188;';
    var meta=(isProp?'Prop Firm':'Personal')+' · '+a.currency+(isProp?' · '+s+Number(a.account_size||0).toLocaleString():'');
    return '<div class="acc-row '+(isAct?'active-acc':'')+'">'
      +'<div class="ar-icon">'+icon+'</div>'
      +'<div class="ar-info"><div class="ar-name">'+esc(a.account_name)+(isAct?' &#9654;':'')+'</div><div class="ar-meta">'+meta+'</div></div>'
      +'<div class="ar-wallet">'+s+wallet.toFixed(0)+'</div>'
      +'<div class="ar-actions">'
      +'<button class="btn-open" onclick="selectAndOpen(\''+a.id+'\')">Open</button>'
      +'<button class="btn-del" onclick="deleteAccount(\''+a.id+'\',\''+esc(a.account_name)+'\')">Delete</button>'
      +'</div></div>';
  }).join('');
}

async function selectAndOpen(id){
  localStorage.setItem('rp_active_account_'+cu.id,id);
  goTo('accounts.html');
}

async function deleteAccount(id,name){
  if(!confirm('Delete "'+name+'"?\n\nThis will permanently delete the account and ALL trades within it. This cannot be undone.')) return;
  if(!confirm('Final confirmation — delete "'+name+'" forever?')) return;
  var r1=await supabase.from('trade_journal').delete().eq('account_id',id);
  var r2=await supabase.from('trading_accounts').delete().eq('id',id);
  if(r2.error){alert('Error: '+r2.error.message);return;}
  if(localStorage.getItem('rp_active_account_'+cu.id)===id) localStorage.removeItem('rp_active_account_'+cu.id);
  await load();
}
</script>

<!-- MOBILE BOTTOM NAV -->
<nav class="bnav">

  <button class="bn-add" onclick="goToAddTrade()">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

  <button class="bn-item active" onclick="openMore()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
    <span>More</span>
  </button>
</nav>
<div class="mo-ov" id="mo-ov" onclick="closeMore()"></div>
<div class="mo-sh" id="mo-sh">

  <div class="ms-title">More</div>
  <nav class="ms-nav">
    <a class="ms-link" href="profile.html">

      <svg class="ms-chev" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </a>
    <a class="ms-link" href="leaderboard.html">
      <div class="ms-icon"><svg viewBox="0 0 24 24"><polyline points="18 20 18 10"/><polyline points="12 20 12 4"/><polyline points="6 20 6 14"/></svg></div>
      <div class="ms-body"><div class="ms-lbl">Leaderboard</div><div class="ms-sub">Top traders — coming soon</div></div>
      <svg class="ms-chev" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </a>
    <a class="ms-link" href="more-accounts.html">
      <div class="ms-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div>
      <div class="ms-body"><div class="ms-lbl">All Accounts</div><div class="ms-sub">View and manage all accounts</div></div>
      <svg class="ms-chev" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </a>
    <a class="ms-link" href="social.html">
      <div class="ms-icon"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></div>
      <div class="ms-body"><div class="ms-lbl">Follow Us</div><div class="ms-sub">Instagram &amp; Discord</div></div>
      <svg class="ms-chev" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </a>
  </nav>
  <button class="ms-out" id="ms-signout">Sign Out</button>
</div>

<script src="supabase-config.js"></script>
<script>
function goToAddTrade(){var id=localStorage.getItem('rp_active_account_'+(window._cu||''));if(!id)id=localStorage.getItem('rp_perf_account');if(id){window.location.href=base()+'add-trade.html';}else{window.location.href=base()+'accounts.html';}}
function openMore(){document.getElementById('mo-sh').classList.add('open');document.getElementById('mo-ov').classList.add('open');document.body.style.overflow='hidden';}
function closeMore(){document.getElementById('mo-sh').classList.remove('open');document.getElementById('mo-ov').classList.remove('open');document.body.style.overflow='';}
function base(){var p=window.location.pathname;return window.location.origin+p.substring(0,p.lastIndexOf('/')+1);}
document.addEventListener('DOMContentLoaded',function(){var btn=document.getElementById('ms-signout');if(btn){btn.addEventListener('click',function(){if(window.handleSignOut)handleSignOut();else{supabase.auth.signOut().then(function(){window.location.href=base()+'auth.html';});}});}});
</script>
</body>
</html>
